name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example, 0.1)
        required: true
        type: string
        default: '0.1'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git libusb python github-cli

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate release tag
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == -* ]]; then
            echo 'Release tags must not start with a dash.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'The release tag already exists. Choose a new tag.' >&2
            exit 1
          fi

      - name: Build and test
        run: |
          make -B
          make test

      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          revision = "HEAD"
          if git("tag", "--merged", "HEAD"):
              previous = git("describe", "--tags", "--abbrev=0", "HEAD")
              revision = f"{previous}..HEAD"

          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          notes = ["### K1NG-Driver", "", "### changes:", ""]
          for commit in git("log", "--reverse", "--format=%H%x09%s", revision, "--").splitlines():
              sha, subject = commit.split("\t", 1)
              subject = subject.replace("\\", "\\\\").replace("[", "\\[").replace("]", "\\]")
              notes.append(f"- [{subject}]({url}/commit/{sha})")

          Path("release-notes.md").write_text("\n".join(notes) + "\n")
          PY
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package driver
        run: |
          mkdir -p dist
          install -m755 k1ng_driver dist/k1ng_driver-linux-x86_64
          cd dist
          sha256sum k1ng_driver-linux-x86_64 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "v${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            dist/k1ng_driver-linux-x86_64 dist/SHA256SUMS
